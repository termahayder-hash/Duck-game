<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultra Duck Runner</title>

<style>
body{
margin:0;
overflow:hidden;
font-family:Arial;
background:black;
}

#ui{
position:absolute;
top:10px;
left:10px;
color:white;
z-index:10;
font-size:20px;
text-shadow:2px 2px 5px black;
}

#gameover{
position:absolute;
width:100%;
height:100%;
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
background:rgba(0,0,0,0.6);
color:white;
font-size:40px;
z-index:20;
}

button{
padding:12px 20px;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
<div>🪙 Coins: <span id="score">0</span></div>
<div>⬆️ Level: <span id="level">1</span></div>
<div>❤️ Lives: <span id="lives">3</span></div>
<div>🏆 High Score: <span id="highscore">0</span></div>
</div>

<div id="gameover">
<div>GAME OVER</div>
<button onclick="restart()">Restart</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene,camera,renderer;
let duck,coin,moon;
let obstacles=[];
let stars=[];

let score=0;
let level=1;
let speed=0.08;
let lives=3;

let velocityY=0;
let gravity=0.015;
let grounded=true;

let gameOver=false;

let highscore=
localStorage.getItem("duckHighscore") || 0;

document.getElementById("highscore").innerText=
highscore;

init();

function init(){

scene=new THREE.Scene();

camera=new THREE.PerspectiveCamera(
70,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,2,6);

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light=new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.5));

// GROUND
const ground=new THREE.Mesh(
new THREE.PlaneGeometry(1000,1000),
new THREE.MeshStandardMaterial({color:0x2ecc71})
);

ground.rotation.x=-Math.PI/2;
scene.add(ground);

// WATER
const water=new THREE.Mesh(
new THREE.PlaneGeometry(1000,30),
new THREE.MeshStandardMaterial({
color:0x3498db,
transparent:true,
opacity:0.8
})
);

water.rotation.x=-Math.PI/2;
water.position.z=-15;
scene.add(water);

// MOON
moon=new THREE.Mesh(
new THREE.SphereGeometry(3,32,32),
new THREE.MeshStandardMaterial({
color:0xffffff,
emissive:0xffffff
})
);

moon.position.set(-20,25,-50);
scene.add(moon);

// STARS
for(let i=0;i<200;i++){

const star=new THREE.Mesh(
new THREE.SphereGeometry(0.08,8,8),
new THREE.MeshStandardMaterial({
color:0xffffff,
emissive:0xffffff
})
);

star.position.set(
Math.random()*200-100,
Math.random()*80+10,
Math.random()*-200
);

scene.add(star);
stars.push(star);
}

// DUCK
duck=createDuck();
duck.position.set(0,1,0);
scene.add(duck);

// COIN
coin=new THREE.Mesh(
new THREE.TorusGeometry(0.3,0.12,16,100),
new THREE.MeshStandardMaterial({
color:0xffd700,
emissive:0xffcc00
})
);

coin.position.set(5,1,0);
scene.add(coin);

// OBSTACLES
for(let i=0;i<7;i++){
spawnObstacle(i*12+15);
}

window.addEventListener("keydown",jump);
window.addEventListener("touchstart",jump);

animate();
}

function createDuck(){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.SphereGeometry(0.8,32,32),
new THREE.MeshStandardMaterial({
color:0xffd700,
emissive:0xaa8800
})
);

body.scale.set(1.3,0.8,1);
g.add(body);

const head=new THREE.Mesh(
new THREE.SphereGeometry(0.45,32,32),
new THREE.MeshStandardMaterial({
color:0xffd700,
emissive:0xaa8800
})
);

head.position.set(1,0.5,0);
g.add(head);

const beak=new THREE.Mesh(
new THREE.ConeGeometry(0.2,0.5,16),
new THREE.MeshStandardMaterial({
color:0xff9900,
emissive:0xaa5500
})
);

beak.rotation.z=-Math.PI/2;
beak.position.set(1.35,0.45,0);
g.add(beak);

return g;
}

function spawnObstacle(x){

const rock=new THREE.Mesh(
new THREE.DodecahedronGeometry(0.7),
new THREE.MeshStandardMaterial({
color:0x555555
})
);

rock.position.set(x,0.8,0);

scene.add(rock);
obstacles.push(rock);
}

function jump(){

if(grounded){
velocityY=0.25;
grounded=false;
}
}

function updateUI(){

document.getElementById("score").innerText=score;
document.getElementById("level").innerText=level;
document.getElementById("lives").innerText=lives;

if(score>highscore){

highscore=score;

localStorage.setItem(
"duckHighscore",
highscore
);

document.getElementById("highscore").innerText=
highscore;
}
}

function restart(){
location.reload();
}

function animate(){

requestAnimationFrame(animate);

if(gameOver) return;

// DAY NIGHT SKY
const t=Date.now()*0.00005;

renderer.setClearColor(
new THREE.Color().setHSL(
0.6,
0.6,
0.15+Math.sin(t)*0.1
)
);

// DUCK RUN
duck.position.x+=speed;

// JUMP PHYSICS
velocityY-=gravity;
duck.position.y+=velocityY;

if(duck.position.y<=1){

duck.position.y=1;
velocityY=0;
grounded=true;
}

// BOUNCE
duck.rotation.y+=0.04;

// CAMERA FOLLOW
camera.position.x=duck.position.x+3;
camera.lookAt(duck.position);

// COIN
coin.rotation.y+=0.1;

if(duck.position.distanceTo(coin.position)<1){

score++;

coin.position.x=
duck.position.x+10+Math.random()*15;

if(score%5===0){
level++;
speed+=0.015;
}

updateUI();
}

// OBSTACLES
obstacles.forEach(o=>{

o.rotation.x+=0.03;
o.rotation.y+=0.03;

if(duck.position.distanceTo(o.position)<1){

lives--;

o.position.x=
duck.position.x+20+Math.random()*20;

updateUI();

if(lives<=0){

gameOver=true;

document.getElementById("gameover").style.display="flex";
}
}

if(o.position.x<duck.position.x-10){

o.position.x=
duck.position.x+30+Math.random()*20;
}

});

renderer.render(scene,camera);
}

</script>

</body>
</html>
