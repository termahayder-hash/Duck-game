<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Duck Level Game</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial; }
#ui {
  position:absolute;
  top:10px;
  left:10px;
  color:white;
  z-index:10;
}
canvas { display:block; }
button {
  padding:10px 15px;
  font-size:16px;
}
</style>
</head>

<body>

<div id="ui">
  <div>⭐ Score: <span id="score">0</span></div>
  <div>⬆️ Level: <span id="level">1</span></div>
  <button onclick="restart()">Restart</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene, camera, renderer;
let duck, coin;
let score = 0;
let level = 1;
let speed = 0.05;
let gameOver = false;

init();

function init(){

scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight,0.1,1000);
camera.position.set(0,2,6);

renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// LIGHT
const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,5);
scene.add(light);

scene.add(new THREE.AmbientLight(0xffffff,0.5));

// GROUND
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200,200),
  new THREE.MeshStandardMaterial({color:0x2ecc71})
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

// DUCK
duck = createDuck();
duck.position.set(0,1,0);
scene.add(duck);

// COIN
coin = new THREE.Mesh(
  new THREE.TorusGeometry(0.3,0.1,16,100),
  new THREE.MeshStandardMaterial({color:0xffd700})
);
coin.position.set(2,1,0);
scene.add(coin);

animate();
}

function createDuck(){
const g = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.SphereGeometry(0.8,32,32),
  new THREE.MeshStandardMaterial({color:0xffd700})
);
body.scale.set(1.2,0.8,1);
g.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.4,32,32),
  new THREE.MeshStandardMaterial({color:0xffd700})
);
head.position.set(1,0.5,0);
g.add(head);

return g;
}

function updateUI(){
document.getElementById("score").innerText = score;
document.getElementById("level").innerText = level;
}

function restart(){
score = 0;
level = 1;
speed = 0.05;
gameOver = false;
duck.position.set(0,1,0);
coin.position.set(2,1,0);
updateUI();
}

function animate(){
requestAnimationFrame(animate);

if(gameOver) return;

// MOVE DUCK
duck.position.x += speed;

// BOUNCE
duck.position.y = 1 + Math.abs(Math.sin(Date.now()*0.005))*0.2;

// COIN ROTATION
coin.rotation.y += 0.05;

// COLLISION
if(duck.position.distanceTo(coin.position) < 1){
  score++;

  // new coin position
  coin.position.x = duck.position.x + 2 + Math.random()*2;

  // LEVEL UP
  if(score % 5 === 0){
    level++;
    speed += 0.02;
  }

  updateUI();
}

// GAME OVER CONDITION
if(duck.position.x > 50){
  gameOver = true;
  alert("Game Over! Score: " + score);
}

camera.position.x = duck.position.x;
camera.lookAt(duck.position);

renderer.render(scene,camera);
}

</script>

</body>
</html>
